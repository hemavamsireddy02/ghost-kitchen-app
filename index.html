<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost Kitchen Ordering Platform – Prototype</title>
<style>
:root{
  --navy:#1e2761;--navy2:#2f3c7e;--copper:#b5651d;--cream:#f4efe8;--bg:#f5f6f8;--surface:#fff;
  --text:#14182b;--muted:#5b6070;--border:#dfe3ea;--good:#2e7d52;--warn:#c9602c;--bad:#b3362b;
  --b0:#3b6fd4;--b1:#e07a2f;--b2:#2f9e6f;--base:#8ea3c7;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--navy2)}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--copper)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.1rem;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;gap:8px;margin-right:auto;background:none;border:0;color:#fff;padding:0}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--copper);display:inline-grid;place-items:center;font-style:normal;overflow:hidden;padding:4px}.logo i img{width:100%;height:100%;display:block}
.logo i svg,.badge svg,.tile svg{width:100%;height:100%;display:block}
.tile{display:inline-block;width:42px;height:42px;border-radius:11px;vertical-align:middle;margin-right:10px}
.nav{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:3px;border-radius:10px}
.nav button{background:none;border:0;color:#dfe3f6;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem}
.nav button.on{background:#fff;color:var(--navy)}
.tools{display:flex;gap:8px}
.tools button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.85rem}
.tools button.on{background:#fff;color:var(--navy);border-color:#fff}
.tools button:hover{background:rgba(255,255,255,.12)}
.tools button.on:hover{background:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:1.7rem;margin:0 0 4px;color:var(--navy)}
h2{font-size:1.15rem;margin:0 0 10px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 18px}
.crumb{font-size:.88rem;margin-bottom:10px}
.crumb button{background:none;border:0;color:var(--navy2);cursor:pointer;padding:0;font-weight:600}
.btn{background:var(--navy);color:#fff;border:0;padding:10px 18px;border-radius:9px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--navy2)}
.btn.alt{background:var(--copper)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--border)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,24,43,.05)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:#eef0f6;color:var(--navy)}
.chip.demo{background:#fff3cd;color:#7a5b00}
.chip.good{background:#e0f2e8;color:var(--good)}.chip.warn{background:#fdebdf;color:var(--warn)}.chip.bad{background:#fbe3e0;color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--bc,var(--navy))}
/* home */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:30px 28px;margin-bottom:18px}
.hero h1{color:#fff;font-size:2rem}.hero p{margin:6px 0 0;color:#d7dcf5;max-width:640px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px}
.stats div b{display:block;font-size:1.35rem}.stats div span{font-size:.8rem;color:#c3caf0}
.role{cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;display:flex;flex-direction:column;gap:6px}
.role:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,24,43,.12)}
.role .ic{width:56px;height:56px;border-radius:15px;overflow:hidden}.role .ic svg{width:100%;height:100%;display:block}
.role h2{margin:6px 0 0}.role p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.role .go{font-weight:700;color:var(--copper);margin-top:6px}
.notice{background:var(--cream);border:1px solid #e3d9c8;border-radius:12px;padding:12px 16px;font-size:.9rem;margin-top:18px}
/* customer */
.brand{cursor:pointer;border-top:6px solid var(--bc);text-align:left;transition:transform .12s,box-shadow .12s}
.brand:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(20,24,43,.12)}
.brand .badge{width:60px;height:60px;border-radius:16px;overflow:hidden;background:var(--bc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem;margin-bottom:8px}
.brand h2{margin-bottom:2px}.brand .meta{color:var(--muted);font-size:.88rem;margin:6px 0}
.menu-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.cat{margin-bottom:18px}.cat h3{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.item .n{flex:1;font-weight:600}.item .p{color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:8px}
.step button{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:800;font-size:1rem;line-height:1}
.step button.plus{background:var(--bc);border-color:var(--bc);color:#fff}
.step span{min-width:18px;text-align:center;font-weight:700}
.cart{position:sticky;top:80px}
.cart .row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:.92rem;border-bottom:1px dashed var(--border)}
.cart .total{font-weight:800;font-size:1.05rem;border:0;padding-top:10px}
.empty{color:var(--muted);font-size:.92rem;padding:10px 0}
label.f{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff}
.pay{display:flex;gap:10px;align-items:center;border:2px solid var(--navy);border-radius:10px;padding:10px 12px;background:#f2f3f9;font-size:.92rem}
.track{display:flex;align-items:center;margin:18px 0 8px}
.track .s{flex:1;text-align:center;position:relative;font-size:.85rem;font-weight:600;color:var(--muted)}
.track .s b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:0 auto 6px;background:#e6e8f0;color:var(--muted);position:relative;z-index:1}
.track .s.done b{background:var(--good);color:#fff}.track .s.cur b{background:var(--copper);color:#fff;box-shadow:0 0 0 5px rgba(181,101,29,.2)}
.track .s.done,.track .s.cur{color:var(--text)}
.track .s::before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:3px;background:#e6e8f0}
.track .s:first-child::before{display:none}
.track .s.done::before,.track .s.cur::before{background:var(--good)}
/* kitchen */
.kbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.kbar .sp{flex:1}
.fchip{border:1px solid var(--border);background:#fff;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:600}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.kstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kstats div{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.kstats b{font-size:1.4rem;display:block}.kstats span{font-size:.8rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:#eceef4;border-radius:14px;padding:10px;min-height:140px}
.col h3{margin:2px 4px 10px;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);display:flex;justify-content:space-between}
.oc{background:#fff;border:1px solid var(--border);border-left:5px solid var(--bc);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.9rem}
.oc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.oc ul{margin:4px 0 8px;padding-left:18px}
.oc .meta{color:var(--muted);font-size:.82rem;margin-bottom:8px}
.oc .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.oc .issue{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.oc .issue select{padding:5px 8px;font-size:.82rem}
/* owner */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--border);background:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.92rem}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpi{padding:14px 16px}
.kpi .lab .chip{white-space:nowrap}.kpi .lab{flex-wrap:wrap}.kpi .lab span:first-child{white-space:nowrap}.kpi .lab{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi .big{font-size:2rem;font-weight:800;color:var(--navy);margin:4px 0 0;font-variant-numeric:tabular-nums}
.kpi .src{font-size:.76rem;color:var(--muted);margin-bottom:8px}
.kpi table{width:100%;border-collapse:collapse;font-size:.85rem}
.kpi td{padding:3px 0;border-top:1px solid #eef0f4}.kpi td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin:10px 0}
.cmp-l{font-weight:700;font-size:.88rem}
.cmp-b{position:relative}
.bar{height:15px;background:#eef0f6;border-radius:4px;margin:3px 0;position:relative;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.bar em{position:absolute;right:6px;top:-1px;font-style:normal;font-size:.72rem;font-weight:700;line-height:15px}
.tick{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--bad)}
.legend{font-size:.78rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
.cols2{display:flex;align-items:flex-end;gap:5px;height:150px;border-bottom:1px solid var(--border);padding-top:16px}
.cols2 .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7rem;font-weight:700}
.cols2 .c i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:1px}
.hl{display:flex;gap:5px;margin-top:4px}.hl span{flex:1;text-align:center;font-size:.74rem;color:var(--muted)}
.feed .r{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #eef0f4;font-size:.88rem}
.feed .r:last-child{border:0}
.feed .r .id{font-weight:700;min-width:78px}.feed .r .rt{margin-left:auto;text-align:right;color:var(--muted)}
.alert{border-left:4px solid var(--warn);background:#fff7f1;padding:9px 12px;border-radius:8px;margin-bottom:8px;font-size:.9rem}
.alert.info{border-color:var(--navy2);background:#f2f3f9}.alert.ok{border-color:var(--good);background:#eef8f2}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th{text-align:left;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:2px solid var(--border)}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f4}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
pre.code{background:#101530;color:#cfe3ff;border-radius:10px;padding:12px 14px;font-size:.78rem;overflow:auto;max-height:230px;margin:8px 0 0}
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin:6px 0 10px}
.flow div{flex:1;min-width:130px;background:#f2f3f9;border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:.82rem}
.flow div b{display:block;color:var(--navy)}
.flow .arr{flex:0 0 auto;min-width:0;background:none;border:0;display:grid;place-items:center;color:var(--copper);font-weight:800;padding:0}
details summary{cursor:pointer;font-weight:700;color:var(--navy);padding:4px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,40,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox h2{font-size:1.3rem}.mbox .stepn{font-size:.78rem;font-weight:700;color:var(--copper);text-transform:uppercase;letter-spacing:.08em}
.mbox .body{margin:10px 0 16px;color:#2a2f45}.mbox .body ul{padding-left:20px;margin:8px 0}
.mbox .foot{display:flex;gap:8px;align-items:center}.mbox .foot .sp{flex:1}
.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:#d4d8e6}.dots i.on{background:var(--copper)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:.9rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.foot-note{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}

.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi td{font-size:.8rem}
.item.off{opacity:.55}.item.off .n{text-decoration:line-through}
.wi{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.wi-items{max-height:320px;overflow:auto;padding-right:4px}
.pin{width:92px;text-align:right;padding:5px 8px;border:1px solid var(--border);border-radius:7px}
.sw{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:.82rem}.sw input{width:auto}
table.t tr.off td{color:var(--muted)}
.hfilters{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:8px}
.tgt{margin:-4px 0 14px}.tgt summary{font-size:.85rem}.tgt-in{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:8px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tgt-in label{font-size:.78rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}.tgt-in input{width:120px;padding:7px 9px;border:1px solid var(--border);border-radius:8px}
.rate{text-align:center;margin:0 0 16px;padding:12px;background:#fbf7ef;border:1px solid #eadfc9;border-radius:12px}.rate p{margin:0 0 6px}
.stars{display:flex;flex-direction:row-reverse;justify-content:center;gap:2px}
.stars button{background:none;border:0;font-size:2.1rem;line-height:1;color:#cfd3e0;cursor:pointer;padding:0 3px}
.stars button:hover,.stars button:hover~button{color:#f2a900}
@media (max-width:1000px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.hfilters{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.wi{grid-template-columns:1fr}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .menu-layout{grid-template-columns:1fr}.cart{position:static}
  .cols{grid-template-columns:1fr}.kstats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .g2,.g3,.g4,.g5,.hfilters{grid-template-columns:1fr}.top-in{gap:8px}.nav button{padding:7px 10px}
  .hero{padding:22px 18px}.hero h1{font-size:1.5rem}.cmp{grid-template-columns:90px 1fr}
}
.cartbar{display:none;position:fixed;left:12px;right:12px;bottom:14px;z-index:30;background:var(--copper);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-size:1rem;cursor:pointer;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bar em{background:rgba(255,255,255,.82);padding:0 5px;border-radius:3px;top:0;right:3px}
@media (max-width:860px){.cartbar{display:flex}.wrap{padding-bottom:90px}}

.sbar{height:10px;background:#e6e9f0;border-radius:6px;overflow:hidden}.sbar i{display:block;height:100%;border-radius:6px}.sbar i.ok{background:var(--navy2)}.sbar i.low{background:var(--copper)}.sbar i.out{background:#c0392b}
.tblwrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:.92rem}.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid #e3e6ee}.tbl td{padding:8px;border-bottom:1px solid #eef0f5;vertical-align:middle}.tbl .num{text-align:right;white-space:nowrap}.tbl .acts{white-space:nowrap;text-align:right}.tbl .acts .btn{margin-left:6px}
.chip.okc{background:#e3f3ea;color:#1c6b43}.chip.warn{background:#fdf0dd;color:#8a5200}
.badge{background:#c0392b;color:#fff;border-radius:10px;padding:1px 8px;font-size:.72rem;vertical-align:middle;margin-left:6px}.nbadge{background:#c0392b;color:#fff;border-radius:9px;padding:0 6px;font-size:.72rem;margin-left:4px}
.when{color:var(--muted);font-size:.78rem;margin-left:6px}.alert.rd{opacity:.6}
.people{display:flex;flex-wrap:wrap;gap:6px}.pp{background:#eef1fa;border-radius:16px;padding:5px 6px 5px 12px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}.pp b{color:var(--navy)}.pp .x{background:#fff;border:1px solid #cfd5e6;border-radius:50%;width:22px;height:22px;line-height:18px;cursor:pointer;color:#a33;font-size:1rem;padding:0}.pp:not(:has(.x)){padding-right:12px}
.shiftc.live{border:2px solid var(--copper)}.cov{margin:10px 0;font-size:.85rem;font-weight:600}.cov.ok{color:#1c6b43}.cov.bad{color:#a35a00}
.addrow{display:flex;gap:8px;flex-wrap:wrap}.addrow select,.addrow input{flex:1;min-width:140px;padding:8px;border:1px solid #cfd5e6;border-radius:8px;font:inherit}
.fb textarea{width:100%;padding:10px;border:1px solid #cfd5e6;border-radius:8px;font:inherit;resize:vertical}.fb-sent{background:#f4f6fb;padding:10px 12px;border-radius:8px}
.fbrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eef0f5}.fbrow .when{margin:2px 0 0}
.logo i img{width:100%;height:100%;display:block}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="logo" data-act="go" data-to="home"><i></i>Ghost Kitchen</button>
  <nav class="nav" id="nav">
    <button data-role="customer" data-act="go" data-to="customer">Customer</button>
    <button data-role="kitchen" data-act="go" data-to="kitchen">Kitchen</button>
    <button data-role="owner" data-act="go" data-to="owner">Owner</button>
  </nav>
  <div class="tools"><button data-act="go" data-to="about" id="aboutBtn">About us</button><button data-act="tour">Take the tour</button><button data-act="reset">Reset demo</button></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="modal" id="modal"></div>

<script>

/* ---------- business logic: orders -> KPIs ---------- */
function orderCalc(o){ let rev=0, prof=0; o.items.forEach(i=>{ rev+=i.price*i.qty; prof+=(i.price-i.cost)*i.qty; }); o.revenue=+rev.toFixed(2); o.profit=+prof.toFixed(2); return o; }
const isDone = o => o.status==='ready' || o.status==='picked';
function kpis(S, b){
  const os = S.orders.filter(o=> b==null || o.brand===b);
  const done = os.filter(isDone);
  const rev = os.reduce((a,o)=>a+o.revenue,0), prof = os.reduce((a,o)=>a+o.profit,0);
  const errs = done.filter(o=>o.error), preps = done.filter(o=>o.prepMin!=null);
  const et = {}; errs.forEach(o=>et[o.error]=(et[o.error]||0)+1);
  const rated = os.filter(o=>o.rating!=null);
  return {n:os.length, rev, prof, margin: rev? prof/rev : null, doneN:done.length,
    ratingN: rated.length, ratingAvg: rated.length? rated.reduce((a,o)=>a+o.rating,0)/rated.length : null,
    errRate: done.length? errs.length/done.length : null, errN: errs.length,
    prepAvg: preps.length? preps.reduce((a,o)=>a+o.prepMin,0)/preps.length : null, errTypes:et, aov: os.length? rev/os.length : null};
}
function csv(S){

  const rows = [head.join(',')];
  S.orders.forEach(o=>{ const d = new Date(o.createdAt);
    o.items.forEach(i=> rows.push([o.id, d.toISOString().slice(0,10), d.toTimeString().slice(0,5), d.getHours(), B[o.brand], (o.source==='walkin'?(o.channel||'Walk-in'):'Ghost Kitchen App'), i.id, '"'+i.name+'"', i.qty, i.price, i.cost, 0,
      (i.price*i.qty).toFixed(2), ((i.price-i.cost)*i.qty).toFixed(2), o.prepMin==null?'':o.prepMin, o.error?'Yes':'No', o.error||'No Error', o.source, o.rating||'', '"'+String(o.feedback||'').replace(/"/g,'""')+'"'].join(','))); });

}

/* ---------- helpers ---------- */
const rnd = (a,b) => a + Math.random()*(b-a);

function pickWeighted(items){ const t = items.reduce((a,i)=>a+i.sold,0); let r = Math.random()*t; for(const i of items){ r-=i.sold; if(r<=0) return i; } return items[0]; }

function demoOrders(n){
  const names = ['Alex','Sam','Jordan','Taylor','Riley','Casey','Morgan','Jamie'];
  mutate(S=>{ for(let k=0;k<n;k++){
    const b = Math.floor(Math.random()*3), menu = effMenu(S,b).filter(x=>x.avail); if(!menu.length) continue; const cnt = 1+Math.floor(Math.random()*3), picked = {};
    for(let j=0;j<cnt;j++){ const it = pickWeighted(menu); picked[it.id] = {id:it.id,name:it.name,price:it.price,cost:it.cost,qty:(picked[it.id]?picked[it.id].qty:0)+1+(Math.random()<.25?1:0)}; }
    S.seq++; S.orders.push(orderCalc({id:'APP-'+String(S.seq).padStart(4,'0'), brand:b, items:Object.values(picked), name:names[Math.floor(Math.random()*names.length)],

  toast(n+' demo orders added to the kitchen queue');
}
function completeAll(){
  mutate(S=>{ S.orders.forEach(o=>{ if(o.status==='new'||o.status==='preparing'){
    const base = DATA.base[B[o.brand]]; o.startedAt = o.startedAt||Date.now(); o.readyAt = Date.now();
    o.prepMin = Math.max(6, Math.min(30, Math.round(base.prepAvg + norm()*3.2)));
    if(!o.error && Math.random() < base.errorRate) o.error = ERR[Math.floor(Math.random()*ERR.length)];
    if(Math.random()<.3) o.rating = Math.max(1,Math.min(5,Math.round(base.rating + norm()*.9)));
    o.status='ready'; } }); });
  toast('Open orders completed with sampled prep times (demo shortcut)');
}

document.addEventListener('change', e=>{ const t = e.target;
  if(t.id==='wibrand'){ wi.b = +t.value; wi.items = {}; render(); }
  else if(t.id==='wichan'){ wi.channel = t.value; }
  else if(t.dataset && t.dataset.mm){ const id = t.dataset.id, it = findItem(id); if(!it) return;
    if(t.dataset.mm==='price'){ const v = parseFloat(t.value);
      if(!(v>it.cost)){ toast('Price must be above the food cost ('+money(it.cost)+')'); render(); return; }
      mutate(S=>{ const ov = S.menuOv[id] = S.menuOv[id]||{}; if(Math.abs(v-it.price)<1e-9) delete ov.price; else ov.price = +v.toFixed(2); if(!Object.keys(ov).length) delete S.menuOv[id]; }); toast(it.name+' is now '+money(v)); }
    else { mutate(S=>{ const ov = S.menuOv[id] = S.menuOv[id]||{}; if(t.checked) delete ov.avail; else ov.avail = false; if(!Object.keys(ov).length) delete S.menuOv[id]; }); toast(it.name+(t.checked?' is back on the menu':' marked sold out')); } }
  else if(t.id==='tmargin'||t.id==='terr'){ const v = parseFloat(t.value); if(!(v>0&&v<100)){ toast('Enter a percentage between 0 and 100'); render(); return; } mutate(S=>{ S.targets[t.id==='tmargin'?'margin':'err'] = v/100; }); toast('Target updated'); }
  else if(t.id==='hst'||t.id==='hiss'||t.id==='hch'){ hf[{hst:'st',hiss:'iss',hch:'ch'}[t.id]] = t.value; applyHistory(); }
});
document.addEventListener('input', e=>{ const t = e.target; if(t.id==='winame') wi.name = t.value; else if(t.id==='fbtext') fbDraft = t.value; else if(t.id==='hq'){ hf.q = t.value; applyHistory(); } });

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if(!t) return; const d = t.dataset, act = d.act;
  if(act==='go') go(d.to);
  else if(act==='inc'||act==='dec'){ const c = cart[+d.b]; if(act==='inc'){ const it = effMenu(load(),+d.b).find(x=>x.id===d.id); if(!it||!it.avail){ toast('Sorry, that item is sold out'); render(); return; } if((c[d.id]||0)>=it.stock){ toast('Only '+it.stock+' left'); return; } }
    c[d.id] = Math.max(0,(c[d.id]||0)+(act==='inc'?1:-1)); if(!c[d.id]) delete c[d.id]; render(); }
  else if(act==='place'){ const b = +d.b, L = cartLines(b); if(!L.length) return; const nm = ($('#cname')||{}).value, nt = ($('#cnote')||{}).value; cname = nm||''; let id;
    mutate(S=>{ S.seq++; id = 'APP-'+String(S.seq).padStart(4,'0'); S.orders.push(orderCalc({id, brand:b, items:L.map(i=>({id:i.id,name:i.name,price:i.price,cost:i.cost,qty:i.qty})), name:(nm||'').trim()||'Guest', note:(nt||'').trim(), createdAt:Date.now(), status:'new', startedAt:null, readyAt:null, prepMin:null, error:null, source:'app'})); consumeStock(S, L); });
    cart[b] = {}; go('customer/order/'+id); }
  else if(act==='start') mutate(S=>{ const o=S.orders.find(x=>x.id===d.id); if(o&&o.status==='new'){ o.status='preparing'; o.startedAt=Date.now(); } });
  else if(act==='ready') mutate(S=>{ const o=S.orders.find(x=>x.id===d.id); if(o&&o.status==='preparing'){ o.status='ready'; o.readyAt=Date.now(); o.prepMin=Math.max(1,Math.round(simMin(o.readyAt-o.startedAt))); } });
  else if(act==='picked') mutate(S=>{ const o=S.orders.find(x=>x.id===d.id); if(o) o.status='picked'; });
  else if(act==='logissue'){ const sel = document.querySelector(`select[data-issue="${d.id}"]`); const v = sel?sel.value:ERR[0]; mutate(S=>{ const o=S.orders.find(x=>x.id===d.id); if(o) o.error=v; }); toast('Issue logged: '+v); }
  else if(act==='clearissue') mutate(S=>{ const o=S.orders.find(x=>x.id===d.id); if(o) o.error=null; });
  else if(act==='kf'){ kFilter = +d.b; render(); }
  else if(act==='otab'){ ownerTab = d.t; render(); }
  else if(act==='wi-open'){ wi.open = !wi.open; render(); }
  else if(act==='wi-cancel'){ wi = {open:false, b:0, items:{}, name:'', channel:'Phone'}; render(); }
  else if(act==='wi-inc'||act==='wi-dec'){ wi.items[d.id] = Math.max(0,(wi.items[d.id]||0)+(act==='wi-inc'?1:-1)); if(!wi.items[d.id]) delete wi.items[d.id]; render(); }
  else if(act==='wi-place'){ const m = effMenu(load(),wi.b).filter(x=>x.avail), L = m.filter(x=>wi.items[x.id]>0).map(i=>({id:i.id,name:i.name,price:i.price,cost:i.cost,qty:wi.items[i.id]})); if(!L.length) return;
    const nm = (wi.name||'').trim()||'Guest'; let id; mutate(S=>{ id = newOrder(S,{brand:wi.b, items:L, name:nm, source:'walkin', channel:wi.channel}).id; consumeStock(S, L); });
    wi = {open:false, b:wi.b, items:{}, name:'', channel:wi.channel}; render(); toast('Order '+id+' added to the queue'); }
  else if(act==='snd'){ sound = !sound; render(); if(sound) beep(); }
  else if(act==='pickall'){ mutate(S=>{ S.orders.forEach(o=>{ if(o.status==='ready' && (kFilter<0||o.brand===kFilter)) o.status='picked'; }); }); }
  else if(act==='rate'){ mutate(S=>{ const o=S.orders.find(x=>x.id===d.id); if(o) o.rating = +d.v; }); toast('Thanks for rating your order'); }
  else if(act==='mm-reset'){ mutate(S=>{ DATA.menu[B[+d.b]].forEach(it=>delete S.menuOv[it.id]); }); toast('Menu reset to original prices'); }
  else if(act==='tgt-reset'){ mutate(S=>{ S.targets = {}; }); toast('Targets reset'); }
  else if(act==='ktab'){ kTab = d.t; render(); }
  else if(act==='st-out'){ mutate(S=>{ const it = findItem(d.id); if(it) setStock(S,it,0,roleNow()); }); const it = findItem(d.id); toast(it.name+' marked out of stock. Owner notified.'); }
  else if(act==='st-fill'){ mutate(S=>{ const it = findItem(d.id); if(it) setStock(S,it,parOf(it),roleNow()); }); toast(findItem(d.id).name+' restocked'); }
  else if(act==='st-restock-low'){ let n=0; mutate(S=>{ B.forEach((_,b)=>DATA.menu[B[b]].forEach(it=>{ if(stockNow(S,it)<=lowOf(it)){ setStock(S,it,parOf(it),roleNow()); n++; } })); }); toast(n? n+' item'+(n>1?'s':'')+' restocked':'Nothing is low'); }
  else if(act==='notes-read') mutate(S=>{ S.notes.forEach(n=>n.read=true); });
  else if(act==='st-day'){ stDay = +d.i; render(); }
  else if(act==='st-add'){ const sel = $('#add_'+d.shift.replace(' ','')); if(!sel||!sel.value){ toast('Choose a person first'); return; } const id = sel.value; mutate(S=>{ const l = rosterOf(S,d.day,d.shift).slice(); if(!l.includes(id)) l.push(id); S.roster[d.day+'|'+d.shift] = l; }); toast('Added to '+d.shift+' on '+d.day); }
  else if(act==='st-rm'){ mutate(S=>{ S.roster[d.day+'|'+d.shift] = rosterOf(S,d.day,d.shift).filter(x=>x!==d.id); }); toast('Removed from '+d.shift+' on '+d.day); }
  else if(act==='st-new'){ const nm = ($('#nsname').value||'').trim(), rl = $('#nsrole').value; if(!nm){ toast('Enter a name first'); return; } mutate(S=>{ S.staff.push({id:'s'+Date.now().toString(36), name:nm, role:rl}); }); toast(nm+' added to the team'); }
  else if(act==='st-del'){ mutate(S=>{ S.staff = S.staff.filter(x=>x.id!==d.id); Object.keys(S.roster).forEach(k=>S.roster[k]=S.roster[k].filter(x=>x!==d.id)); }); toast('Team member removed'); }
  else if(act==='fb-send'){ const v = (($('#fbtext')||{}).value||'').trim(); if(!v){ toast('Write a short comment first'); return; } mutate(S=>{ const o=S.orders.find(x=>x.id===d.id); if(o) o.feedback = v.slice(0,400); }); fbDraft=''; toast('Thanks! Your feedback was sent to the owner'); }
  else if(act==='fb-edit'){ const o = load().orders.find(x=>x.id===d.id); fbDraft = o?o.feedback||'':''; mutate(S=>{ const o=S.orders.find(x=>x.id===d.id); if(o) delete o.feedback; }); }
  else if(act==='rush') demoOrders(8);
  else if(act==='complete') completeAll();
  else if(act==='csv'){ const blob = new Blob([csv(load())],{type:'text/csv'}), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ghost_kitchen_app_orders.csv'; document.body.appendChild(a); a.click(); a.remove(); }
  else if(act==='reset'){ if(confirm('Clear all demo orders on this device?')){ save({seq:0,orders:[],stock:{},notes:[],roster:{}}); cart={0:{},1:{},2:{}}; render(); toast('Demo data cleared'); } }
  else if(act==='tour') tour(0);
  else if(act==='tournext') tour(Math.min(TOUR.length-1,tourI+1));
  else if(act==='tourprev') tour(Math.max(0,tourI-1));
  else if(act==='tourclose'){ $('#modal').classList.remove('on'); }
  else if(act==='tourgo'){ $('#modal').classList.remove('on'); go(d.to); }
});
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') e.target.classList.remove('on'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#modal').classList.remove('on'); });
